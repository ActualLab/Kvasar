name: Publish

# Started by Publish.cmd (see Publish.ps1). "Publish.cmd -no-test" sets skip-tests, which skips the tests.
# After publishing, it creates the GitHub release and mirrors the package to GitHub Packages.
# The "release" environment requires an approval from one of its reviewers (repository settings) before the job runs.
# NuGet authenticates via trusted publishing, so the repository holds no API keys:
# a nuget.org trusted publishing policy for ActualLab/Kvasar + Publish.yml + the "release" environment;
# the NUGET_USER secret is the nuget.org profile name of that policy's creator.
on:
  workflow_dispatch:
    inputs:
      skip-tests:
        description: Skip the tests
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # version.json's publicReleaseRefSpec: other branches get versions with a git hash suffix
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Trusted publishing exchanges the workflow's OIDC token for a short-lived key
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Avoid shallow clone for Nerdbank.GitVersioning
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Get version
        id: version
        run: '"version=$(dotnet nbgv get-version -v NuGetPackageVersion)" >> $env:GITHUB_OUTPUT'

      # The same suite as build-and-test.yml: everything except the wall-clock-bound slow tests
      - name: Run tests
        if: ${{ !inputs.skip-tests }}
        run: dotnet test ActualLab.Kvasar.slnx -c Release --filter "Category!=Slow"

      - name: Pack NuGet package
        run: ./Pack.cmd

      # The key it produces is valid for 1 hour, so it goes right before the push
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # On Windows, "dotnet nuget push" doesn't expand a relative wildcard path, so each file goes by its full path
      - name: Push NuGet package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem artifacts/nupkg/*.nupkg)
          if (-not $packages) { throw "No packages in artifacts/nupkg." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source "https://api.nuget.org/v3/index.json" --api-key "$env:NUGET_API_KEY" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error

  # A separate job, so the publishing one (which runs package build scripts) never gets write access to the repository.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: >
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION"
          --notes "NuGet package: https://www.nuget.org/packages/ActualLab.Kvasar/$VERSION"

  # Mirrors the package to GitHub Packages, so it's listed on the repository page.
  # nuget.org stays the primary feed.
  github-packages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Push NuGet package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          dotnet nuget push "packages/*.nupkg" --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
          --api-key "$GH_TOKEN" --skip-duplicate
